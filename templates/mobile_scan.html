<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>📱 Scan — StockETF RGI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#1a1a2e;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;color:#fff}
.card{background:#fff;color:#1a1a2e;border-radius:16px;padding:28px;width:100%;max-width:380px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.logo{font-size:1.1rem;font-weight:800;color:#1a1a2e;margin-bottom:4px}
.logo span{color:#E8661A}
.subtitle{font-size:.78rem;color:#888;margin-bottom:24px}
.scan-icon{font-size:4rem;margin-bottom:16px}
h1{font-size:1.1rem;font-weight:700;color:#1a1a2e;margin-bottom:8px}
p{font-size:.82rem;color:#666;line-height:1.6;margin-bottom:24px}
.btn{display:block;width:100%;padding:14px;border-radius:10px;font-size:.95rem;font-weight:700;border:none;cursor:pointer;text-decoration:none;margin-bottom:12px;transition:.15s}
.btn-orange{background:#E8661A;color:#fff}
.btn-orange:hover{background:#c85510}
.btn-outline{background:#f5f5f5;color:#333;border:1px solid #ddd}
.btn-outline:hover{background:#e8e8e8}
.search-section{margin-top:8px;padding-top:20px;border-top:1px solid #f0f0f0}
.search-input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:.88rem;margin-bottom:10px}
.search-input:focus{outline:none;border-color:#E8661A}
.info{background:#f0f9ff;border-radius:8px;padding:12px;font-size:.75rem;color:#0369a1;margin-top:16px;text-align:left}
</style>
</head>
<body>
<div class="card">
  <div class="logo">📦 Stock<span>ETF RGI</span></div>
  <div class="subtitle">Base arrière ETF Dense</div>
  
  <div class="scan-icon">📱</div>
  <h1>Mode Scan Terrain</h1>
  <p>Scannez le QR code d'un article pour faire une sortie rapide depuis votre téléphone.</p>
  
  <!-- Bouton scan QR (ouvre la caméra sur mobile) -->
  <a href="#" onclick="startScan()" class="btn btn-orange">
    📷 Scanner un QR Code
  </a>
  
  <!-- Recherche manuelle -->
  <div class="search-section">
    <p style="margin-bottom:12px;font-size:.8rem">Ou recherchez manuellement :</p>
    <input type="text" class="search-input" id="search-input" 
           placeholder="Ex: ART-001 ou GANT..." 
           oninput="rechercheArticle(this.value)">
    <div id="search-results"></div>
  </div>
  
  <div class="info">
    💡 Pour scanner : pointez la caméra vers le QR code affiché sur l'étagère
  </div>
  
  <a href="/" class="btn btn-outline" style="margin-top:16px">⬅️ Retour application</a>
</div>

<script>
function startScan() {
  // Ouvrir le scanner QR via l'API caméra du navigateur
  // Sur mobile, ça ouvre directement la caméra
  if ('BarcodeDetector' in window) {
    // API native si disponible
    scanWithBarcodeDetector();
  } else {
    // Fallback : demander à l'utilisateur de taper l'URL du QR
    var code = prompt('Entrez le code article (ex: ART-001) :');
    if (code && code.trim()) {
      window.location.href = '/scan/article/' + code.trim().toUpperCase();
    }
  }
}

async function scanWithBarcodeDetector() {
  try {
    const detector = new BarcodeDetector({formats: ['qr_code']});
    const stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment'}});
    // Créer une vidéo temporaire pour scanner
    const video = document.createElement('video');
    video.srcObject = stream;
    video.play();
    
    const interval = setInterval(async () => {
      const barcodes = await detector.detect(video);
      if (barcodes.length > 0) {
        clearInterval(interval);
        stream.getTracks().forEach(t => t.stop());
        window.location.href = barcodes[0].rawValue;
      }
    }, 500);
  } catch(e) {
    alert('Scanner non disponible — entrez le code manuellement');
  }
}

let searchTimer;
function rechercheArticle(q) {
  clearTimeout(searchTimer);
  if (q.length < 2) { document.getElementById('search-results').innerHTML = ''; return; }
  searchTimer = setTimeout(function() {
    fetch('/api/recherche-articles?q=' + encodeURIComponent(q))
      .then(r => r.json())
      .then(data => {
        var html = '';
        data.slice(0,5).forEach(function(a) {
          var color = a.stock==0?'#dc2626':a.stock<5?'#d97706':'#16a34a';
          html += '<a href="/scan/article/'+a.id+'" style="display:block;padding:10px;background:#f8f9fa;border-radius:8px;margin-bottom:6px;text-decoration:none;color:#1a1a2e;border-left:3px solid '+color+'">'
                + '<strong style="font-size:.82rem">'+a.designation+'</strong>'
                + '<br><span style="font-size:.72rem;color:#888">'+a.id+' — 📦 '+a.container+' — Stock: <strong style="color:'+color+'">'+a.stock+' '+a.unite+'</strong></span>'
                + '</a>';
        });
        if (!data.length) html = '<p style="font-size:.78rem;color:#888;text-align:center">Aucun résultat</p>';
        document.getElementById('search-results').innerHTML = html;
      });
  }, 300);
}
</script>
</body>
</html>
