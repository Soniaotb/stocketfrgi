<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📱 Scan QR — StockETF RGI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#1a1a2e;min-height:100vh;color:#fff;overflow-x:hidden}

.header{background:rgba(0,0,0,.85);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{font-size:.88rem;font-weight:800}.logo span{color:#E8661A}
.btn-back{color:rgba(255,255,255,.8);font-size:.78rem;text-decoration:none;background:rgba(255,255,255,.12);padding:6px 12px;border-radius:20px}

/* Mode buttons */
.mode-bar{display:flex;gap:0;background:rgba(255,255,255,.08);border-radius:12px;margin:14px 16px;overflow:hidden}
.mode-btn{flex:1;padding:12px;font-size:.85rem;font-weight:700;border:none;cursor:pointer;background:transparent;color:rgba(255,255,255,.6);transition:.2s}
.mode-btn.active-sortie{background:#E8661A;color:#fff;border-radius:12px}
.mode-btn.active-reception{background:#16a34a;color:#fff;border-radius:12px}

/* Scanner container */
.scanner-wrap{position:relative;margin:0 16px;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:1}
#reader{width:100%}

/* Overlay cadre */
.scan-overlay{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center}
.scan-frame{width:65%;aspect-ratio:1;position:relative}
.corner{position:absolute;width:24px;height:24px;border-color:#E8661A;border-style:solid}
.corner.tl{top:0;left:0;border-width:3px 0 0 3px}
.corner.tr{top:0;right:0;border-width:3px 3px 0 0}
.corner.bl{bottom:0;left:0;border-width:0 0 3px 3px}
.corner.br{bottom:0;right:0;border-width:0 3px 3px 0}
.scan-line-anim{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#E8661A,transparent);animation:scan 2s linear infinite}
@keyframes scan{0%{top:5%}100%{top:95%}}

.status{text-align:center;padding:10px 16px;font-size:.8rem;color:rgba(255,255,255,.7)}
.status.success{color:#16a34a;font-weight:700}
.status.error{color:#dc2626}

/* Recherche manuelle */
.search-section{margin:14px 16px}
.search-label{font-size:.75rem;color:rgba(255,255,255,.5);margin-bottom:8px;text-align:center}
.search-bar{display:flex;gap:8px}
.search-input{flex:1;padding:11px 14px;border-radius:25px;border:none;background:rgba(255,255,255,.12);color:#fff;font-size:.88rem}
.search-input::placeholder{color:rgba(255,255,255,.4)}
.search-input:focus{outline:none;background:rgba(255,255,255,.2)}
.results{margin-top:10px;max-height:200px;overflow-y:auto}
.result-item{display:block;padding:10px 12px;background:rgba(255,255,255,.08);border-radius:10px;margin-bottom:6px;text-decoration:none;color:#fff}
.result-item.sortie{border-left:3px solid #E8661A}
.result-item.reception{border-left:3px solid #16a34a}
.result-name{font-size:.82rem;font-weight:600}
.result-info{font-size:.7rem;color:rgba(255,255,255,.5);margin-top:2px}

.tip{margin:12px 16px;background:rgba(255,255,255,.06);border-radius:10px;padding:12px;font-size:.74rem;color:rgba(255,255,255,.5);line-height:1.6;text-align:center}
</style>
</head>
<body>

<div class="header">
  <div class="logo">📦 Stock<span>ETF RGI</span></div>
  <a href="/" class="btn-back">✕ Fermer</a>
</div>

<!-- Mode sortie / entrée -->
<div class="mode-bar">
  <button class="mode-btn active-sortie" id="btn-sortie" onclick="setMode('sortie')">📤 Sortie stock</button>
  <button class="mode-btn" id="btn-reception" onclick="setMode('reception')">📥 Entrée stock</button>
</div>

<!-- Scanner -->
<div class="scanner-wrap">
  <div id="reader"></div>
  <div class="scan-overlay">
    <div class="scan-frame">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
      <div class="scan-line-anim"></div>
    </div>
  </div>
</div>

<div class="status" id="status">📷 Pointez la caméra vers un QR code</div>

<!-- Recherche manuelle -->
<div class="search-section">
  <div class="search-label">— Ou recherchez manuellement —</div>
  <div class="search-bar">
    <input type="text" class="search-input" id="search-input"
           placeholder="🔍 Tapez un article..."
           oninput="rechercheArticle(this.value)"
           autocomplete="off" autocorrect="off" spellcheck="false">
  </div>
  <div class="results" id="results"></div>
</div>

<div class="tip">
  💡 Sur Android Chrome : assurez-vous d'avoir autorisé la caméra.<br>
  Tenez le téléphone stable à 15-20 cm du QR code.
</div>

<!-- Html5-QRCode — bien plus puissant que jsQR sur Android -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script>
var currentMode = 'sortie';
var scanner = null;
var scanned = false;

function setMode(mode) {
  currentMode = mode;
  var btnS = document.getElementById('btn-sortie');
  var btnR = document.getElementById('btn-reception');
  btnS.className = 'mode-btn' + (mode==='sortie' ? ' active-sortie' : '');
  btnR.className = 'mode-btn' + (mode==='reception' ? ' active-reception' : '');
  // Mettre à jour les résultats de recherche
  rechercheArticle(document.getElementById('search-input').value);
}

function onScanSuccess(decodedText) {
  if (scanned) return;
  scanned = true;
  
  document.getElementById('status').textContent = '✅ QR Code lu !';
  document.getElementById('status').className = 'status success';
  
  // Vibration sur Android
  if (navigator.vibrate) navigator.vibrate(200);
  
  // Arrêter le scanner
  if (scanner) scanner.stop();
  
  setTimeout(function() {
    var url = decodedText;
    if (url.includes('/scan/article/')) {
      var artId = url.split('/scan/article/')[1].split('?')[0].split('/')[0];
      if (currentMode === 'reception') {
        window.location.href = '/scan/reception/' + artId;
      } else {
        window.location.href = '/scan/article/' + artId;
      }
    } else if (url.match(/ART-\d+/)) {
      var match = url.match(/ART-\d+/);
      var dest = currentMode === 'sortie' ? '/scan/article/' : '/scan/reception/';
      window.location.href = dest + match[0];
    } else {
      window.location.href = url;
    }
  }, 400);
}

function onScanError(err) {
  // Silencieux — erreurs normales pendant le scan
}

function startScanner() {
  scanner = new Html5Qrcode("reader");
  
  var config = {
    fps: 15,
    qrbox: { width: 220, height: 220 },
    aspectRatio: 1.0,
    supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA],
    experimentalFeatures: { useBarCodeDetectorIfSupported: true }
  };
  
  scanner.start(
    { facingMode: "environment" },
    config,
    onScanSuccess,
    onScanError
  ).catch(function(err) {
    document.getElementById('status').textContent = '⚠️ Caméra non disponible — utilisez la recherche ci-dessous';
    document.getElementById('status').className = 'status error';
  });
}

// Lancer le scanner
startScanner();

// Recherche manuelle
var searchTimer;
function rechercheArticle(q) {
  clearTimeout(searchTimer);
  var results = document.getElementById('results');
  if (q.length < 2) { results.innerHTML = ''; return; }
  searchTimer = setTimeout(function() {
    fetch('/api/recherche-articles?q=' + encodeURIComponent(q))
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var html = '';
        data.slice(0,6).forEach(function(a) {
          var color = a.stock==0?'#dc2626':a.stock<5?'#d97706':'#16a34a';
          var href = currentMode==='sortie' ? '/scan/article/'+a.id : '/scan/reception/'+a.id;
          html += '<a href="'+href+'" class="result-item '+currentMode+'">'
                + '<div class="result-name">'+a.designation+'</div>'
                + '<div class="result-info">'+a.id+' — 📦 '+a.container
                + ' — <span style="color:'+color+';font-weight:700">'+a.stock+' '+a.unite+'</span></div>'
                + '</a>';
        });
        if (!data.length) html = '<p style="text-align:center;font-size:.76rem;color:rgba(255,255,255,.4);padding:10px">Aucun résultat</p>';
        results.innerHTML = html;
      });
  }, 300);
}

// Nettoyage quand on quitte la page
window.addEventListener('beforeunload', function() {
  if (scanner) scanner.stop().catch(function(){});
});
</script>
</body>
</html>
