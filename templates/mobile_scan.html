<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📱 Scan QR — StockETF RGI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#000;min-height:100vh;overflow:hidden;color:#fff}
#video{width:100vw;height:100vh;object-fit:cover;position:fixed;top:0;left:0;z-index:1}
#canvas{display:none}
.overlay{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:2;pointer-events:none}
.scan-frame{position:absolute;top:50%;left:50%;transform:translate(-50%,-65%);width:230px;height:230px}
.scan-corner{position:absolute;width:28px;height:28px;border-color:#E8661A;border-style:solid}
.scan-corner.tl{top:0;left:0;border-width:4px 0 0 4px}
.scan-corner.tr{top:0;right:0;border-width:4px 4px 0 0}
.scan-corner.bl{bottom:0;left:0;border-width:0 0 4px 4px}
.scan-corner.br{bottom:0;right:0;border-width:0 4px 4px 0}
.scan-line{position:absolute;left:4px;right:4px;height:2px;background:linear-gradient(90deg,transparent,#E8661A,transparent);animation:scanAnim 2s linear infinite}
@keyframes scanAnim{0%{top:10px}100%{top:215px}}
.dark-overlay{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.scan-hole{position:absolute;top:50%;left:50%;transform:translate(-50%,-65%);width:230px;height:230px;background:transparent;box-shadow:0 0 0 2000px rgba(0,0,0,.55)}

.header{position:fixed;top:0;left:0;right:0;z-index:10;background:linear-gradient(to bottom,rgba(0,0,0,.85),transparent);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;pointer-events:all}
.logo{font-size:.88rem;font-weight:800}.logo span{color:#E8661A}
.btn-back{color:rgba(255,255,255,.8);font-size:.78rem;text-decoration:none;background:rgba(255,255,255,.12);padding:6px 12px;border-radius:20px}

.mode-btns{position:fixed;top:50%;left:50%;transform:translate(-50%,60px);z-index:10;display:flex;gap:10px;pointer-events:all}
.mode-btn{padding:10px 20px;border:2px solid rgba(255,255,255,.3);border-radius:25px;font-size:.82rem;font-weight:700;cursor:pointer;background:rgba(0,0,0,.5);color:#fff;backdrop-filter:blur(10px);transition:.2s}
.mode-btn.active{background:#E8661A;border-color:#E8661A}
.mode-btn.reception.active{background:#16a34a;border-color:#16a34a}

.scan-label{position:fixed;top:50%;left:50%;transform:translate(-50%,120px);z-index:10;text-align:center;pointer-events:none}
.scan-label p{font-size:.78rem;color:rgba(255,255,255,.75);background:rgba(0,0,0,.45);padding:7px 16px;border-radius:20px;backdrop-filter:blur(8px)}

.footer{position:fixed;bottom:0;left:0;right:0;z-index:10;background:linear-gradient(to top,rgba(0,0,0,.92),transparent);padding:16px 16px 28px;pointer-events:all}
.search-bar{display:flex;gap:8px;margin-bottom:10px}
.search-input{flex:1;padding:11px 14px;border-radius:25px;border:none;background:rgba(255,255,255,.14);color:#fff;font-size:.88rem;backdrop-filter:blur(10px)}
.search-input::placeholder{color:rgba(255,255,255,.45)}
.search-input:focus{outline:none;background:rgba(255,255,255,.22)}
.search-results{max-height:160px;overflow-y:auto}
.result-item{display:block;padding:10px 12px;background:rgba(255,255,255,.1);border-radius:10px;margin-bottom:5px;text-decoration:none;color:#fff;backdrop-filter:blur(10px)}
.result-item.sortie{border-left:3px solid #E8661A}
.result-item.reception{border-left:3px solid #16a34a}
.result-name{font-size:.8rem;font-weight:600}
.result-info{font-size:.7rem;color:rgba(255,255,255,.55);margin-top:2px}

.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:20;padding:10px 20px;border-radius:25px;font-size:.82rem;font-weight:700;display:none;white-space:nowrap}
.toast.sortie{background:#E8661A;color:#fff}
.toast.reception{background:#16a34a;color:#fff}
.toast.show{display:block}

.cam-error{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;text-align:center;background:rgba(0,0,0,.88);padding:24px;border-radius:16px;width:85%;max-width:320px;pointer-events:all}
.cam-error h2{font-size:.92rem;font-weight:700;margin-bottom:8px;color:#E8661A}
.cam-error p{font-size:.76rem;color:rgba(255,255,255,.65);line-height:1.5}
</style>
</head>
<body>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<div class="overlay">
  <div class="scan-hole"></div>
  <div class="scan-frame">
    <div class="scan-corner tl"></div>
    <div class="scan-corner tr"></div>
    <div class="scan-corner bl"></div>
    <div class="scan-corner br"></div>
    <div class="scan-line"></div>
  </div>
</div>

<div class="header">
  <div class="logo">📦 Stock<span>ETF RGI</span></div>
  <a href="/" class="btn-back">✕ Fermer</a>
</div>

<!-- Boutons mode SORTIE / ENTRÉE -->
<div class="mode-btns">
  <button class="mode-btn active" id="btn-sortie" onclick="setMode('sortie')">📤 Sortie</button>
  <button class="mode-btn reception" id="btn-reception" onclick="setMode('reception')">📥 Entrée</button>
</div>

<div class="scan-label">
  <p id="scan-status">Pointez vers un QR code</p>
</div>

<div class="toast" id="toast">QR Code détecté !</div>

<div class="footer">
  <div class="search-bar">
    <input type="text" class="search-input" id="search-input"
           placeholder="🔍 Ou tapez un article..."
           oninput="rechercheArticle(this.value)"
           autocomplete="off" autocorrect="off" spellcheck="false">
  </div>
  <div class="search-results" id="search-results"></div>
</div>

<div class="cam-error" id="cam-error" style="display:none">
  <h2>📷 Caméra non disponible</h2>
  <p>Autorisez l'accès à la caméra, ou utilisez la recherche ci-dessous.</p>
  <p style="font-size:.7rem;color:rgba(255,255,255,.35);margin-top:8px">iPhone : Safari uniquement · Android : Chrome</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsqr/1.4.0/jsQR.min.js"></script>
<script>
var video = document.getElementById('video');
var canvas = document.getElementById('canvas');
var ctx = canvas.getContext('2d');
var scanning = true;
var currentMode = 'sortie'; // 'sortie' ou 'reception'

function setMode(mode) {
  currentMode = mode;
  document.getElementById('btn-sortie').classList.toggle('active', mode==='sortie');
  document.getElementById('btn-reception').classList.toggle('active', mode==='reception');
  var status = document.getElementById('scan-status');
  if (mode === 'sortie') {
    status.textContent = '📤 Mode SORTIE — Pointez vers un QR code';
  } else {
    status.textContent = '📥 Mode ENTRÉE — Pointez vers un QR code';
  }
  // Relancer le scan
  scanning = true;
}

async function startCamera() {
  try {
    var stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    video.srcObject = stream;
    video.play();
    video.onloadedmetadata = function() {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      startScanning();
    };
  } catch(err) {
    document.getElementById('cam-error').style.display = 'block';
    document.getElementById('scan-status').textContent = '⌨️ Utilisez la recherche ci-dessous';
    document.body.style.background = '#1a1a2e';
  }
}

function startScanning() {
  setInterval(function() {
    if (!scanning) return;
    if (video.readyState !== video.HAVE_ENOUGH_DATA) return;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    var code = jsQR(imageData.data, imageData.width, imageData.height, {
      inversionAttempts: 'dontInvert'
    });
    if (code) {
      scanning = false;
      var type = currentMode === 'sortie' ? 'sortie' : 'reception';
      showToast(currentMode === 'sortie' ? '📤 Sortie détectée !' : '📥 Entrée détectée !', type);
      setTimeout(function() {
        var url = code.data;
        // Adapter l'URL selon le mode
        if (url.includes('/scan/article/')) {
          var artId = url.split('/scan/article/')[1];
          if (currentMode === 'reception') {
            window.location.href = '/scan/reception/' + artId;
          } else {
            window.location.href = url;
          }
        } else if (url.startsWith('ART-') || url.match(/^ART-\d+/)) {
          var dest = currentMode === 'sortie' ? '/scan/article/' : '/scan/reception/';
          window.location.href = dest + url.trim();
        } else {
          window.location.href = url;
        }
      }, 600);
    }
  }, 200);
}

function showToast(msg, type) {
  var toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast ' + type + ' show';
  setTimeout(function() { toast.classList.remove('show'); }, 2000);
}

var searchTimer;
function rechercheArticle(q) {
  clearTimeout(searchTimer);
  var results = document.getElementById('search-results');
  if (q.length < 2) { results.innerHTML = ''; return; }
  searchTimer = setTimeout(function() {
    fetch('/api/recherche-articles?q=' + encodeURIComponent(q))
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var html = '';
        data.slice(0,5).forEach(function(a) {
          var stockColor = a.stock==0?'#dc2626':a.stock<5?'#d97706':'#16a34a';
          var href = currentMode==='sortie' ? '/scan/article/'+a.id : '/scan/reception/'+a.id;
          html += '<a href="'+href+'" class="result-item '+currentMode+'">'
                + '<div class="result-name">'+a.designation+'</div>'
                + '<div class="result-info">'+a.id+' — 📦 '+a.container
                + ' — <span style="color:'+stockColor+';font-weight:700">'+a.stock+' '+a.unite+'</span></div>'
                + '</a>';
        });
        if (!data.length) html = '<div style="text-align:center;font-size:.76rem;color:rgba(255,255,255,.4);padding:10px">Aucun résultat</div>';
        results.innerHTML = html;
      });
  }, 300);
}

startCamera();
if ('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(function(){});
</script>
</body>
</html>
